name: Frontend CI

# 触发条件：推送到 main 分支或发起 PR 时运行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    # npm 命令必须在 frontend/ 子目录执行，仓库根目录没有 package.json
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 有 package-lock.json 时用 ci，可复现且更快
      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_number }}
          path: frontend/dist

