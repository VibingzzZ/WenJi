name: Java CI with Maven

# 触发条件：当你 push 代码到 main/master 分支，或者提交 Pull Request 时自动运行
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 在 GitHub 提供的最新 Linux 环境中运行

    steps:
      # 1. 检出你的代码
      - uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # 开启 Maven 缓存，第二次运行会快很多

      # 3. 执行 Maven 构建命令
      # 注意：pom.xml 在 backend/ 子目录，必须用 working-directory 指定，否则根目录找不到 pom
      - name: Build with Maven
        working-directory: backend
        run: mvn -B clean package -DskipTests

      # 4.上传构建好的 jar 包，方便下载检查
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-${{ github.run_number }} # 这样每次构建名字都不一样，比如 my-app-1, my-app-2
          path: backend/target/*.jar