services:
  mysql:
    image: mysql:8.0
    container_name: wenji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: wenji
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
      - ./mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - wenji-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: wenji-redis
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass 123321
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wenji-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123321", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wenji-backend
    restart: unless-stopped
    depends_on: # 保证Mysql和Redis先启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: # 把数据库连接信息换成mysql和redis的连接信息
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wenji?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: 123321
      # LangChain4j 向量库是独立配置前缀，必须单独覆盖，否则容器内仍会连 localhost
      LANGCHAIN4J_COMMUNITY_REDIS_HOST: redis
      LANGCHAIN4J_COMMUNITY_REDIS_PORT: 6379
      LANGCHAIN4J_COMMUNITY_REDIS_PASSWORD: 123321
      # 变量名必须与 application.yml 中 ${QWEN_API_KEY} 占位符一致
      QWEN_API_KEY: ${QWEN_API_KEY}
    volumes: # 映射上传文件到容器内
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    networks: # 添加网络，方便容器之间通信
      - wenji-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wenji-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports: # 映射端口
      - "80:80"
    networks:
      - wenji-network

volumes: # 定义数据卷，用于持久化存储
  mysql_data:
  redis_data:
  uploads_data:

networks: # 定义网络，用于容器之间的通信，通过名字互相访问
  wenji-network:
    driver: bridge
